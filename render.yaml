databases:
  - name: restaurant-rms-db
    plan: free
    databaseName: restaurant_rms
    user: restaurant_rms

services:
  - type: web
    name: restaurant-rms
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn RMS.wsgi:application
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: restaurant-rms-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: WEB_CONCURRENCY
        value: 4
